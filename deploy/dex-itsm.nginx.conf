# Add inside the server { } block that serves the console, BEFORE its `location /` block.
# The console keeps everything else.

# This app's own files (hashed, cache forever).
location /itsm-static/ {
    alias /opt/dex_itsm_frontend/dist/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The ITSM addresses: always this app's index.html (it is a single-page app).
location ~ ^/(tickets|setup)(/|$) {
    root /opt/dex_itsm_frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
